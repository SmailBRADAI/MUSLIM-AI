name: Hajj & Umrah app — test site

# Publishes main to GitHub Pages so the app can be installed and tested on a phone (T046).
# One-time setup: repository Settings → Pages → Source: GitHub Actions.
on:
  push:
    branches: [main]
    paths: ["apps/hajj-umrah/**", ".github/workflows/hajj-umrah-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/hajj-umrah

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/hajj-umrah/package-lock.json
      - run: npm ci
      - run: npm run validate:content
      # Served from https://<owner>.github.io/<repo>/, so assets, packs and the service worker use that base.
      - run: npm run build -- --base=/${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/hajj-umrah/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
